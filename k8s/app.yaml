apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: student-feedback-k8s
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: student-feedback-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - name: mongodb
              containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand("ping").ok || quit(1)
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand("ping").ok || quit(1)
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: student-feedback-k8s
spec:
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: student-feedback-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: mongo:7
          command:
            - /bin/sh
            - -c
            - until mongosh --host mongodb --quiet --eval 'db.adminCommand("ping").ok || quit(1)'; do echo "Waiting for MongoDB"; sleep 2; done
      containers:
        - name: api
          image: student-feedback-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: mongodb://mongodb:27017/complaint_system
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: student-feedback-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: student-feedback-k8s
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: admin-seed
  namespace: student-feedback-k8s
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: admin-seed
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mongodb
          image: mongo:7
          command:
            - /bin/sh
            - -c
            - until mongosh --host mongodb --quiet --eval 'db.adminCommand("ping").ok || quit(1)'; do echo "Waiting for MongoDB"; sleep 2; done
      containers:
        - name: admin-seed
          image: student-feedback-api:dev
          imagePullPolicy: IfNotPresent
          command:
            - node
            - createAdmin.js
          env:
            - name: MONGO_URI
              value: mongodb://mongodb:27017/complaint_system
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: student-feedback-secrets
                  key: ADMIN_NAME
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: student-feedback-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-feedback-secrets
                  key: ADMIN_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: student-feedback-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: student-feedback-client:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: student-feedback-k8s
spec:
  selector:
    app: client
  ports:
    - name: http
      port: 80
      targetPort: http
